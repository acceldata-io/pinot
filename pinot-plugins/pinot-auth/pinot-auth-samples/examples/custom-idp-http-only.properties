# In-house identity provider without custom code: the built-in http handler calls the provider's validation API and
# maps its JSON answer. Use this when the provider's API alone can vouch for a token (it checks signature, expiry and
# revocation itself and returns the user), so no shared secret is needed in Pinot.

pinot.auth.method=oauth2
pinot.auth.oauth2.handlers=idm

pinot.auth.oauth2.handler.idm.type=http
# JWTs with iss=identityManager come here; opaque tokens too (opaque.tokens defaults to true for http)
pinot.auth.oauth2.handler.idm.issuer=identityManager
pinot.auth.oauth2.handler.idm.client.id=pinot

# The call. Placeholders: ${token} ${client.id} ${now.epochSeconds} ${now.epochMillis} ${secret:<alias>}
pinot.auth.oauth2.handler.idm.request.url=https://idm.example.com/v1/token/validate
pinot.auth.oauth2.handler.idm.request.method=GET
# request.header.<any id>=<Header-Name>: <value>
pinot.auth.oauth2.handler.idm.request.header.auth=Authorization: Bearer ${token}
pinot.auth.oauth2.handler.idm.request.header.key=X-Api-Key: ${secret:pinot.oauth2.idm.api.key}
# For a POST with a JSON body instead:
#pinot.auth.oauth2.handler.idm.request.method=POST
#pinot.auth.oauth2.handler.idm.request.content.type=application/json
#pinot.auth.oauth2.handler.idm.request.body={"token":"${token}","client":"${client.id}"}

# The answer: 200 + valid=true accepts; 400/401/403 rejects; anything else = provider unavailable (request refused)
pinot.auth.oauth2.handler.idm.success.status=200
pinot.auth.oauth2.handler.idm.reject.status=400,401,403
pinot.auth.oauth2.handler.idm.success.condition=$.valid == true
pinot.auth.oauth2.handler.idm.map.user=$.data.userId
pinot.auth.oauth2.handler.idm.map.user.transform=lower;strip-suffix:@example.com
pinot.auth.oauth2.handler.idm.map.groups=$.data.groups
pinot.auth.oauth2.handler.idm.map.expiresAt=$.expiresAt
pinot.auth.oauth2.handler.idm.map.expiresAt.format=epochSeconds
pinot.auth.oauth2.handler.idm.map.attribute.tenant=$.data.tid

# Optional second call for groups, with ${user} from the first answer
#pinot.auth.oauth2.handler.idm.enrich.url=https://idm.example.com/v1/users/${user}/groups
#pinot.auth.oauth2.handler.idm.enrich.header.key=X-Api-Key: ${secret:pinot.oauth2.idm.api.key}
#pinot.auth.oauth2.handler.idm.enrich.map.groups=$.groups

pinot.auth.oauth2.handler.idm.http.timeout.ms=3000
pinot.auth.oauth2.handler.idm.retries=1
pinot.auth.oauth2.handler.idm.breaker.failures=5
pinot.auth.oauth2.handler.idm.breaker.open.seconds=30
pinot.auth.oauth2.handler.idm.cache.ttl.seconds=60
pinot.auth.oauth2.handler.idm.negative.cache.seconds=10
