# In-house identity provider without custom code: the built-in http handler calls the provider's validation API and
# maps its JSON answer. Use this when the provider's API alone can vouch for a token (it checks signature, expiry and
# revocation itself and returns the user), so no shared secret is needed in Pinot.
#
# PREVIEW: the http handler type is not part of this build yet. The keys below follow its design (request template
# with ${token} / ${secret:<alias>} placeholders, success condition, JsonPath mapping) and this file is updated when
# the handler ships. Until then use custom-idp-java-handler.properties.

pinot.auth.method=oauth2
pinot.auth.oauth2.handlers=idm

pinot.auth.oauth2.handler.idm.type=http
pinot.auth.oauth2.handler.idm.issuer=identityManager
pinot.auth.oauth2.handler.idm.request.url=https://idm.example.com/v1/token/validate
pinot.auth.oauth2.handler.idm.request.method=GET
pinot.auth.oauth2.handler.idm.request.header.Authorization=Bearer ${token}
pinot.auth.oauth2.handler.idm.success.status=200
pinot.auth.oauth2.handler.idm.success.condition=$.valid == true
pinot.auth.oauth2.handler.idm.map.user=$.data.userId
pinot.auth.oauth2.handler.idm.map.groups=$.data.groups
pinot.auth.oauth2.handler.idm.timeout.ms=3000
pinot.auth.oauth2.handler.idm.cache.ttl.seconds=60
