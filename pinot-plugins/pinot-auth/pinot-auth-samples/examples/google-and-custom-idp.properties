# Two providers side by side under the one oauth2 method: the in-house provider (sample java handler), Google ID
# tokens (built-in google type) and Google access tokens (sample GoogleTokenHandler). JWTs are routed by issuer,
# opaque ya29.* access tokens by pattern.

pinot.auth.method=oauth2
pinot.auth.oauth2.handlers=idm,google,google-access

pinot.auth.oauth2.handler.idm.type=java
pinot.auth.oauth2.handler.idm.class=org.apache.pinot.plugin.auth.samples.CustomIdpTokenHandler
pinot.auth.oauth2.handler.idm.issuer=identityManager
pinot.auth.oauth2.handler.idm.hmac.secret.alias=pinot.oauth2.idm.signing.secret
pinot.auth.oauth2.handler.idm.userinfo.url=https://idm.example.com/v1/session/user
pinot.auth.oauth2.handler.idm.user.field=data.userId

pinot.auth.oauth2.handler.google.type=google
pinot.auth.oauth2.handler.google.client.ids=1234-abc.apps.googleusercontent.com
pinot.auth.oauth2.handler.google.hosted.domain=example.com

pinot.auth.oauth2.handler.google-access.type=java
pinot.auth.oauth2.handler.google-access.class=org.apache.pinot.plugin.auth.samples.GoogleTokenHandler
# Same jar as the idm handler
pinot.auth.oauth2.handler.google-access.jar.dir=/opt/pinot/plugins/pinot-auth-handlers/idm
pinot.auth.oauth2.handler.google-access.token.pattern=ya29\\..+
pinot.auth.oauth2.handler.google-access.client.ids=1234-abc.apps.googleusercontent.com
pinot.auth.oauth2.handler.google-access.hosted.domain=example.com
pinot.auth.oauth2.handler.google-access.cache.ttl.seconds=60
