# In-house identity provider through the sample java handler (CustomIdpTokenHandler).
# Tokens: HS512 JWTs with iss=identityManager, tenant id (tid) and session id (sid), no user name, no audience.
# Same settings on the controller, broker, server and minion configuration.

pinot.auth.method=oauth2
pinot.auth.oauth2.handlers=idm

pinot.auth.oauth2.handler.idm.type=java
pinot.auth.oauth2.handler.idm.class=org.apache.pinot.plugin.auth.samples.CustomIdpTokenHandler
# Jar location; the default is <plugins dir>/pinot-auth-handlers/<handler name>
pinot.auth.oauth2.handler.idm.jar.dir=/opt/pinot/plugins/pinot-auth-handlers/idm
# Tokens whose iss is identityManager are sent to this handler
pinot.auth.oauth2.handler.idm.issuer=identityManager
pinot.auth.oauth2.handler.idm.timeout.ms=5000
pinot.auth.oauth2.handler.idm.cache.ttl.seconds=60

# 1. Local check: HS512 signature with the shared secret from the credential store (never the secret itself here)
pinot.auth.oauth2.handler.idm.algorithms=HS512
pinot.auth.oauth2.handler.idm.hmac.secret.alias=pinot.oauth2.idm.signing.secret
pinot.auth.oauth2.handler.idm.required.claims=tid,sid,version=4.0
pinot.auth.oauth2.handler.idm.clock.skew.seconds=60

# 2. Remote check: is the session still live? 2xx = yes, 400/401/403 = no, anything else = provider unavailable
pinot.auth.oauth2.handler.idm.validation.url=https://idm.example.com/v1/token/validate
pinot.auth.oauth2.handler.idm.validation.style=bearer
pinot.auth.oauth2.handler.idm.validation.active.field=valid

# 3. Who is it? The token has no user name, so ask the provider
pinot.auth.oauth2.handler.idm.userinfo.url=https://idm.example.com/v1/session/user
pinot.auth.oauth2.handler.idm.user.field=data.userId
pinot.auth.oauth2.handler.idm.groups.field=data.groups
# Without a user-info call, use a claim instead (e.g. the session id) - usually not what authorization needs
#pinot.auth.oauth2.handler.idm.user.claim=sid

pinot.auth.oauth2.handler.idm.http.timeout.ms=3000
